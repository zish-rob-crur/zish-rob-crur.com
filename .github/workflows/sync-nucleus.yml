name: Sync Nucleus Content

on:
  repository_dispatch:
    types:
      - nucleus-docs-updated
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nucleus
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync submodule configuration
        run: git submodule sync --recursive

      - name: Update Nucleus submodule
        run: git submodule update --init --remote external/nucleus-apple-mcp

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Commit submodule update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- external/nucleus-apple-mcp; then
            echo "Submodule already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          short_sha="$(printf '%s' "${{ github.event.client_payload.source_sha || '' }}" | cut -c1-7)"
          commit_message="chore: sync nucleus article source"
          if [[ -n "$short_sha" ]]; then
            commit_message="$commit_message ($short_sha)"
          fi

          git add external/nucleus-apple-mcp
          git commit -m "$commit_message"
          git push
